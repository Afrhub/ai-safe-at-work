# Netlify config for AI Safe@Work
# Mirror of doctrine §§ Anti-scraping + Audit-readiness postures.
# Reviewed quarterly per .audit/course-quality/refresh-cadence.md.

[build]
  publish = "."
  command = ""

# Explicit rather than relying on auto-detection: a misdetected directory here is a
# silent 404 on the payment endpoint. Functions are served from /.netlify/functions/*
# (leading dot), which is separate from the /netlify/* source block further down.
[functions]
  directory = "netlify/functions"

# Don't deploy audit-pack via Netlify even if path is requested
[[redirects]]
  from = "/.audit/*"
  to = "/404.html"
  status = 404
  force = true

# Doctrine: stays public on GitHub (transparency wedge per doctrine
# § Distribution principle 3), hidden from Netlify marketing site.
# Marketing site stays sales-shaped; transparency artefact lives on
# GitHub only. See decision log entry 2026-05-19.
[[redirects]]
  from = "/DOCTRINE.md"
  to = "/404.html"
  status = 404
  force = true

# README: dev-docs, not marketing. Same posture as doctrine — public on
# GitHub, hidden from Netlify marketing surface. Decided 2026-05-19.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Everything else internal. Netlify publishes the whole repo, so anything not
# blocked here is served. DOCTRINE and README were blocked by name in
# 2026-05-19 and the rule was never generalised; on 2026-07-26 a full sweep of
# every tracked file found the DB migrations, the test suite, the build
# scripts, both Remotion source projects (including the paid module narration),
# the MSP partner deck and a Word copy of the course content all returning 200.
#
# NOTE: `from = "/*.md"` does NOT work — a Netlify splat only matches a
# trailing path and cannot carry an extension suffix. Directories use /dir/*,
# individual files are named. Add new internal files here or they ship.
#
# Deliberately left public: LICENSE* (normal), changelog.json (the JSON Feed),
# assets/video/* (the module videos the course actually plays).
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/specs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Function SOURCE. publish = "." would otherwise serve
# /netlify/functions/create-checkout-session.mjs as a static file. This does not
# affect the live endpoint, which is /.netlify/functions/* with a leading dot.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/video-m1/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/video-m2/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SCOPE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOFF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/v2/scorm/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/skills-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AI-SafeWork-MSP-Partner-Deck.pptx"
  to = "/404.html"
  status = 404
  force = true

# Sales deck: internal. It carried noindex but was still reachable by anyone with the
# URL, and its inline scripts are dead under the production CSP anyway. Blocked on
# 11 Aug 2026 rather than left half-working on the open web.
[[redirects]]
  from = "/sales-deck.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AI_SafeAtWork_Course_Content_v1_Word.docx"
  to = "/404.html"
  status = 404
  force = true

# Headers below in _headers (separate file for clarity + per-path scoping).
# netlify.toml [[headers]] supports glob patterns but per-path detail in
# _headers reads better and matches Netlify-native pattern.
